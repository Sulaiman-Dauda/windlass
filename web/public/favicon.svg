<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The w from the wordmark, and nothing else.

    Three attempts at drawing the mechanism failed the only test that matters:
    at 16 pixels a drum with cable on it resolved into a snail, then a battery.
    A favicon gets a silhouette, so it has to be a shape that survives being
    almost illegible, and the brief was that the name is the logo. This is the
    wordmark's own w, so the small mark and the word are the same drawing
    rather than two ideas sitting next to each other.

    The cable stays as the rule beneath, which is the one thing that reads at
    any size and ties it to the full lockup.
  -->
  <g fill="none" stroke="#0d6f97" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 7 L10 22.5 L16 12.5 L22 22.5 L27.5 7" stroke-width="4.2"/>
    <path d="M4.5 27.5 H27.5" stroke-width="2.8"/>
  </g>
</svg>
