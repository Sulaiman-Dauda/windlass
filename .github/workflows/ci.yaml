name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      # v6 of the action pulls golangci-lint v1.x, which is built with go1.24 and
      # refuses to load a config for a `go 1.26` module:
      #   can't load config: the Go language version (go1.24) used to build
      #   golangci-lint is lower than the targeted Go version (1.26)
      # v9 pulls golangci-lint v2.x, built with a current toolchain.
      # Advisory, not blocking — see issue #1.
      #
      # The lint step could never actually run before: the action installed
      # golangci-lint v1, which refuses a `go 1.26` module. Fixing that revealed
      # ~120 pre-existing findings (almost all errcheck on deferred Close calls).
      # That is surfaced debt, not a regression, and it is not something to fix
      # with a mass edit — each one needs a decision about whether the error
      # matters.
      #
      # So the linter runs and its output is visible on every PR, but it does not
      # gate merges until the backlog is cleared. Remove continue-on-error then.
      - uses: golangci/golangci-lint-action@v9
        continue-on-error: true
        with:
          version: v2.12.2
      - run: go test ./...

  frontend:
    name: Frontend build + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist

  binary:
    name: Production binary (embedded frontend)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Cross-compile linux/amd64 + arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -tags embedweb -o bin/windlass-linux-amd64 ./cmd/windlass
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -tags embedweb -o bin/windlass-linux-arm64 ./cmd/windlass
      - name: Smoke test embedded binary + RAM budget
        run: |
          export WINDLASS_DATA=$(mktemp -d)
          ./bin/windlass-linux-amd64 &
          PID=$!
          sleep 1
          curl -fsS http://localhost:8080/api/v1/system/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/ | grep -qi '<!doctype html>'
          curl -fsS http://localhost:8080/api/v1/openapi.yaml | grep -q 'openapi: 3.1'
          # Principle 9: idle RSS < 40 MB.
          sleep 2
          RSS_KB=$(grep VmRSS /proc/$PID/status | awk '{print $2}')
          echo "idle RSS: ${RSS_KB} kB"
          test "$RSS_KB" -lt 40960
          kill $PID
      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/

  integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Install Caddy
        run: |
          sudo apt-get update -q
          sudo apt-get install -y caddy
          sudo systemctl stop caddy || true
          sudo systemctl disable caddy || true
      - run: go test -tags integration -count=1 ./...

  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    needs: binary
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin
      - name: Start windlass
        run: |
          chmod +x bin/windlass-linux-amd64
          export WINDLASS_DATA=$(mktemp -d)
          bin/windlass-linux-amd64 2>server.log &
          sleep 1
          TOKEN=$(grep -o '"setup_token":"[0-9a-f]*"' server.log | head -n1 | cut -d'"' -f4)
          echo "WINDLASS_SETUP_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "WINDLASS_URL=http://localhost:8080" >> "$GITHUB_ENV"
      - name: Run Playwright
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results

  installer:
    name: Installer smoke test
    runs-on: ubuntu-latest
    needs: binary
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binaries
          path: bin
      - name: Run installer with local binary
        run: |
          chmod +x bin/windlass-linux-amd64
          sudo sh install/install.sh --yes --no-caddy --binary bin/windlass-linux-amd64
      - name: Verify service and first-run flow
        run: |
          sleep 2
          sudo systemctl is-active windlass-docker-proxy
          sudo systemctl is-active windlass
          curl -fsS http://127.0.0.1:2375/version | grep -q ApiVersion
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:2375/auth)" = 403
          ! sudo -u windlass docker -H unix:///var/run/docker.sock info
          curl -fsS http://localhost:8080/api/v1/system/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/api/v1/auth/status | grep -q '"needs_setup":true'
          sudo journalctl -u windlass | grep -q setup_token
      - name: Apps survive panel death (principle 7)
        run: |
          docker run -d --name survivor nginx:alpine
          sudo systemctl stop windlass
          docker ps --format '{{.Names}}' | grep -q survivor
          docker rm -f survivor
