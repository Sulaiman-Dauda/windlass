name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: latest
      - run: go test ./...

  frontend:
    name: Frontend build + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  binary:
    name: Production binary (embedded frontend)
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - name: Cross-compile linux/amd64 + arm64
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -tags embedweb -o bin/windlass-linux-amd64 ./cmd/windlass
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -tags embedweb -o bin/windlass-linux-arm64 ./cmd/windlass
      - name: Smoke test embedded binary
        run: |
          ./bin/windlass-linux-amd64 &
          sleep 1
          curl -fsS http://localhost:8080/api/v1/system/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/ | grep -qi '<!doctype html>'
          kill %1
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  integration:
    name: Integration tests (Docker)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Caddy
        run: |
          sudo apt-get update -q
          sudo apt-get install -y caddy
          sudo systemctl stop caddy || true
      - run: go test -tags integration -count=1 ./...
