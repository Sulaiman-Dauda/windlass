name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Cross-compile
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X github.com/windlass-dev/windlass/internal/version.Version=${VERSION} -X github.com/windlass-dev/windlass/internal/version.Commit=${GITHUB_SHA::7}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -tags embedweb -ldflags "$LDFLAGS" -o dist/windlass-linux-amd64 ./cmd/windlass
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -tags embedweb -ldflags "$LDFLAGS" -o dist/windlass-linux-arm64 ./cmd/windlass

      - name: Checksums
        working-directory: dist
        run: sha256sum windlass-linux-* > checksums.txt


      # A checksums file published in the same release as the binaries proves
      # very little: whoever can write the release can rewrite both. This asks
      # GitHub to sign a statement tying these exact bytes to this workflow and
      # commit, stored outside the release where a release write cannot reach.
      # It matters here more than most projects, because the documented install
      # path is `curl -fsSL https://get.windlass.run | sudo sh`.
      #
      # Verify a download with:
      #   gh attestation verify windlass-linux-amd64 --repo Sulaiman-Dauda/windlass
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/windlass-linux-amd64
            dist/windlass-linux-arm64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Windlass ${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/windlass-linux-amd64 dist/windlass-linux-arm64 dist/checksums.txt install/install.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the runtime stage's apk install needs emulation now.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v4
      - name: Build and push image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            BINARY_STAGE=prebuilt
          tags: |
            ghcr.io/sulaiman-dauda/windlass:latest
            ghcr.io/sulaiman-dauda/windlass:${{ github.ref_name }}

      # The image is a second distribution path and needs its own attestation,
      # addressed by digest rather than by a mutable tag.
      #
      #   gh attestation verify oci://ghcr.io/sulaiman-dauda/windlass:latest \
      #     --repo Sulaiman-Dauda/windlass
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sulaiman-dauda/windlass
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
