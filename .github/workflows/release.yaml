name: Release

# Releases are cut by pushing a v* tag from a green main, usually as a weekly
# batch, and the same day for a security fix or a broken install. Merging to
# main releases nothing. Panels tracking this repo (WINDLASS_UPDATE_REPO) see
# the new tag as "update available".

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # Neither setup step caches: a release builds from clean downloads,
          # never from a cache that a pull request run could have written.
          cache: false

      - name: Gate on tests
        run: |
          go vet ./...
          go test ./...

      - name: Build frontend
        working-directory: web
        run: npm ci && npm run build

      - name: Cross-compile
        run: |
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-s -w -X github.com/windlass-dev/windlass/internal/version.Version=${VERSION} -X github.com/windlass-dev/windlass/internal/version.Commit=${GITHUB_SHA::7}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -tags embedweb -ldflags "$LDFLAGS" -o dist/windlass-linux-amd64 ./cmd/windlass
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -tags embedweb -ldflags "$LDFLAGS" -o dist/windlass-linux-arm64 ./cmd/windlass

      - name: Checksums
        working-directory: dist
        run: sha256sum windlass-linux-* > checksums.txt


      # A checksums file published in the same release as the binaries proves
      # very little: whoever can write the release can rewrite both. This asks
      # GitHub to sign a statement tying these exact bytes to this workflow and
      # commit, stored outside the release where a release write cannot reach.
      # It matters here more than most projects, because the documented install
      # path is `curl -fsSL https://get.windlass.run | sudo sh`.
      #
      # Verify a download with:
      #   gh attestation verify windlass-linux-amd64 --repo Sulaiman-Dauda/windlass
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/windlass-linux-amd64
            dist/windlass-linux-arm64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Windlass ${GITHUB_REF_NAME}" \
            --generate-notes \
            --latest \
            dist/windlass-linux-amd64 dist/windlass-linux-arm64 dist/checksums.txt install/install.sh

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Only the runtime stage's apk install needs emulation now.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and push image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            BINARY_STAGE=prebuilt
          tags: |
            ghcr.io/sulaiman-dauda/windlass:latest
            ghcr.io/sulaiman-dauda/windlass:${{ github.ref_name }}

      # The image is a second distribution path and needs its own attestation,
      # addressed by digest rather than by a mutable tag.
      #
      #   gh attestation verify oci://ghcr.io/sulaiman-dauda/windlass:latest \
      #     --repo Sulaiman-Dauda/windlass
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/sulaiman-dauda/windlass
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
