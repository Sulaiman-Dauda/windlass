openapi: 3.1.0
info:
  title: Windlass API
  description: |
    HTTP API of the Windlass Docker Compose control plane. All endpoints are
    versioned under /api/v1. Authentication uses an HTTP-only session cookie
    obtained from /auth/login or /auth/setup.
  version: 0.1.0
servers:
  - url: /api/v1

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: windlass_session
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member, viewer] }
        totp_enabled: { type: boolean }
        has_password:
          type: boolean
          description: False for OAuth-only accounts; such users skip password re-entry on destructive actions.
    AuthStatus:
      type: object
      required: [needs_setup, authenticated]
      properties:
        needs_setup: { type: boolean }
        authenticated: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string }
        version: { type: string }

paths:
  /system/health:
    get:
      summary: Liveness and version
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/status:
    get:
      summary: Bootstrap and session state
      description: Public. Drives the frontend's setup/login/app routing.
      operationId: getAuthStatus
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }

  /auth/setup:
    post:
      summary: First-run admin creation
      description: |
        Claims a fresh instance using the one-time setup token printed to the
        server log at first start. Creates the admin account and signs the
        caller in. Fails once any user exists.
      operationId: setupAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
      responses:
        "204": { description: Admin created, session cookie set }
        "403":
          description: Invalid token or instance already claimed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      summary: Sign in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "204": { description: Session cookie set }
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/logout:
    post:
      summary: Sign out
      operationId: logout
      security: [{ session: [] }]
      responses:
        "204": { description: Session revoked, cookie cleared }

  /auth/me:
    get:
      summary: Current user
      operationId: getMe
      security: [{ session: [] }]
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/totp/setup:
    post:
      summary: Begin TOTP enrollment; returns secret + otpauth URL
      operationId: totpSetup
      security: [{ session: [] }]
      responses:
        "200": { description: "{secret, otpauth_url}" }

  /auth/totp/verify:
    post:
      summary: Confirm enrollment with a code; activates TOTP
      operationId: totpVerify
      security: [{ session: [] }]
      responses:
        "204": { description: TOTP enabled }

  /auth/totp/disable:
    post:
      summary: Disable TOTP for the current user
      operationId: totpDisable
      security: [{ session: [] }]
      responses:
        "204": { description: TOTP disabled }

  /auth/oauth/providers:
    get:
      summary: Which OAuth providers are configured (public)
      operationId: oauthProviders
      responses:
        "200": { description: "{github: bool, google: bool}" }

  /auth/oauth/{provider}/start:
    get:
      summary: Begin OAuth sign-in (redirects to the provider)
      operationId: oauthStart
      responses:
        "302": { description: Redirect to provider }

  /auth/oauth/{provider}/callback:
    get:
      summary: OAuth callback — signs in EXISTING users by verified email
      operationId: oauthCallback
      responses:
        "302": { description: Redirect to the app (or /?oauth_error=...) }

  /auth/oauth/github/callback/git:
    get:
      summary: GitHub callback for the repo-scope connect flow (admin); stores the token as a git connection
      operationId: gitConnectCallback
      security: [{ session: [] }]
      responses:
        "302": { description: Redirect to /settings?git_connected=... (or ?git_error=...) }

  /users:
    get:
      summary: List users (admin)
      operationId: listUsers
      security: [{ session: [] }]
      responses:
        "200": { description: Array of users }
    post:
      summary: Create a user (admin); omit password for OAuth-only accounts
      operationId: createUser
      security: [{ session: [] }]
      responses:
        "201": { description: Created }

  /users/{id}/role:
    put:
      summary: Change a user's role (admin; self-demotion refused)
      operationId: setUserRole
      security: [{ session: [] }]
      responses:
        "204": { description: Updated }

  /users/{id}:
    delete:
      summary: Delete a user (admin; self-deletion refused)
      operationId: deleteUser
      security: [{ session: [] }]
      responses:
        "204": { description: Deleted }

  /system/oauth/{provider}:
    put:
      summary: Configure an OAuth provider's client credentials (admin)
      operationId: setOAuthConfig
      security: [{ session: [] }]
      responses:
        "204": { description: Saved encrypted }

  /webhooks/github-app:
    post:
      summary: GitHub App push webhook — fans out to all matching projects (public, signature-verified)
      operationId: githubAppWebhook
      responses:
        "200": { description: "{result, deployed[]}" }
        "403": { description: Invalid signature }

  /webhooks/{provider}/{project}:
    post:
      summary: Git push webhook (public, signature-verified)
      operationId: webhook
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [github, gitlab] } }
        - { name: project, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Deployment triggered }
        "200": { description: Ignored (branch mismatch or auto-deploy off) }
        "202": { description: Skipped, a deployment is already running }
        "403": { description: Signature verification failed }

  /events:
    get:
      summary: Global platform event stream (SSE)
      operationId: globalEvents
      security: [{ session: [] }]
      parameters:
        - { name: topics, in: query, schema: { type: string }, description: Comma-separated topic filter }
      responses:
        "200":
          description: text/event-stream of platform events

  /proxy/status:
    get:
      summary: Caddy availability
      operationId: proxyStatus
      security: [{ session: [] }]
      responses:
        "200": { description: "{available, version}" }

  /system/metrics:
    get:
      summary: Host, node, and container metrics
      operationId: systemMetrics
      security: [{ session: [] }]
      responses:
        "200": { description: "{host, node, containers}" }

  /system/update:
    get:
      summary: Check for a panel update (admin)
      operationId: checkUpdate
      security: [{ session: [] }]
      responses:
        "200": { description: "{version, current_version, update_available}" }
    post:
      summary: Apply the available update (admin)
      operationId: applyUpdate
      security: [{ session: [] }]
      responses:
        "200": { description: Update applied; panel restarts }
        "400": { description: Self-update unsupported in this install mode }

  /system/docker/images:
    get:
      summary: Docker image disk usage (admin)
      operationId: imageDiskUsage
      security: [{ session: [] }]
      responses:
        "200": { description: Image counts and reclaimable bytes }

  /system/docker/images/prune:
    post:
      summary: Remove old unused images while protecting recent deployments (admin)
      operationId: pruneImages
      security: [{ session: [] }]
      responses:
        "200": { description: Deleted image count and reclaimed bytes }

  /system/panel-domain:
    get:
      summary: Get the Settings-managed panel hostname (admin)
      operationId: getPanelDomain
      security: [{ session: [] }]
      responses:
        "200": { description: Hostname, HTTPS URL, and Caddy availability }
    put:
      summary: Configure or remove the panel hostname in Caddy (admin)
      description: Set hostname to an empty string to remove only the Windlass-owned panel route.
      operationId: setPanelDomain
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string, example: windlass.example.com }
      responses:
        "200": { description: Desired hostname stored and applied }
        "400": { description: Invalid hostname }

  /system/backups/s3:
    get:
      summary: S3 backup destination status (admin; never returns secrets)
      operationId: getS3Config
      security: [{ session: [] }]
      responses:
        "200": { description: "{configured, endpoint, bucket}" }
    put:
      summary: Configure the S3 backup destination (admin)
      operationId: setS3Config
      security: [{ session: [] }]
      responses:
        "204": { description: Saved (credentials stored encrypted) }

  /projects:
    get:
      summary: List projects
      operationId: listProjects
      security: [{ session: [] }]
      responses:
        "200": { description: Array of projects }
    post:
      summary: Create a project (member)
      operationId: createProject
      security: [{ session: [] }]
      responses:
        "201": { description: Created with a starter compose.yaml on disk }
        "409": { description: Name already exists }

  /projects/{name}:
    get:
      summary: Get a project
      operationId: getProject
      security: [{ session: [] }]
      responses:
        "200": { description: Project }
        "404": { description: Not found }
    delete:
      summary: Delete a project — containers stopped, directory removed (member; requires password re-entry unless the account is OAuth-only)
      operationId: deleteProject
      security: [{ session: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: The caller's account password. Required when the account has one.
      responses:
        "204": { description: Deleted }
        "403":
          description: Password missing (password_required) or wrong (invalid_password)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /projects/scan:
    post:
      summary: Scan the stacks directory and rebuild the project index (member)
      operationId: scanProjects
      security: [{ session: [] }]
      responses:
        "200": { description: Number of filesystem projects indexed }

  /projects/{name}/files:
    get:
      summary: List project files
      operationId: listProjectFiles
      security: [{ session: [] }]
      responses:
        "200": { description: Array of file infos }

  /projects/{name}/files/{path}:
    get:
      summary: Read an editable file (yaml/env/conf/json/toml/txt/md)
      operationId: readProjectFile
      security: [{ session: [] }]
      responses:
        "200": { description: "{path, content}" }
    put:
      summary: Write an editable file (member; 1MiB cap)
      operationId: writeProjectFile
      security: [{ session: [] }]
      responses:
        "204": { description: Written atomically }

  /projects/{name}/env:
    get:
      summary: Read env vars (decrypted)
      operationId: getProjectEnv
      security: [{ session: [] }]
      responses:
        "200": { description: "Object of KEY: value" }
    put:
      summary: Replace env vars (member; stored AES-256-GCM encrypted)
      operationId: setProjectEnv
      security: [{ session: [] }]
      responses:
        "204": { description: Saved }

  /system/github-app:
    get:
      summary: GitHub App status (admin)
      operationId: githubAppStatus
      security: [{ session: [] }]
      responses:
        "200": { description: "{configured, slug?, owner?, html_url?}" }

  /system/github-app/create:
    get:
      summary: Begin the two-click GitHub App manifest flow (admin)
      operationId: githubAppCreate
      security: [{ session: [] }]
      responses:
        "200": { description: Auto-submitting manifest form redirecting to GitHub }

  /system/github-app/callback:
    get:
      summary: Manifest conversion callback — stores app credentials and enables sign-in (admin)
      operationId: githubAppCallback
      security: [{ session: [] }]
      responses:
        "302": { description: Redirect to Settings → Users & auth }

  /projects/{name}/git:
    put:
      summary: Configure git source (member); returns webhook secret once
      operationId: configureProjectGit
      security: [{ session: [] }]
      responses:
        "200": { description: "{webhook_secret, webhook_url, webhook_registered}" }

  /projects/{name}/services:
    get:
      summary: Live service status (compose ps)
      operationId: projectServices
      security: [{ session: [] }]
      responses:
        "200": { description: "{services, note?}" }

  /projects/{name}/logs:
    get:
      summary: Container log stream (SSE)
      operationId: projectLogs
      security: [{ session: [] }]
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - { name: follow, in: query, schema: { type: boolean, default: true } }
        - { name: tail, in: query, schema: { type: integer, default: 200 } }
      responses:
        "200": { description: text/event-stream of log lines }

  /projects/{name}/terminal:
    get:
      summary: Interactive terminal (WebSocket; member)
      description: |
        JSON text frames in ({"type":"input","data":...} / {"type":"resize",...}),
        raw binary terminal output frames out.
      operationId: projectTerminal
      security: [{ session: [] }]
      responses:
        "101": { description: Switching protocols }

  /projects/{name}/actions/{action}:
    post:
      summary: start | stop | restart (member)
      operationId: projectAction
      security: [{ session: [] }]
      responses:
        "204": { description: Done }
        "502": { description: Compose command failed }

  /projects/{name}/deployments:
    get:
      summary: List deployments
      operationId: listDeployments
      security: [{ session: [] }]
      responses:
        "200": { description: Array of deployments, newest first }
    post:
      summary: Deploy (member)
      operationId: createDeployment
      security: [{ session: [] }]
      responses:
        "201": { description: Deployment queued }
        "409": { description: A deployment is already running }

  /projects/{name}/deployments/{number}:
    get:
      summary: Get a deployment
      operationId: getDeployment
      security: [{ session: [] }]
      responses:
        "200": { description: Deployment }

  /projects/{name}/deployments/{number}/events:
    get:
      summary: Deployment event stream (SSE, replay + live, Last-Event-ID)
      operationId: deploymentEvents
      security: [{ session: [] }]
      responses:
        "200": { description: text/event-stream; closes after terminal replay }

  /projects/{name}/deployments/{number}/rollback:
    post:
      summary: Roll back to this deployment's recorded image digests (member)
      operationId: rollback
      security: [{ session: [] }]
      responses:
        "201": { description: Rollback deployment queued }

  /projects/{name}/domains:
    get:
      summary: List domains with routing status
      operationId: listDomains
      security: [{ session: [] }]
      responses:
        "200": { description: Array of domains }
    post:
      summary: Add a domain (member) — Caddy routes + automatic HTTPS
      operationId: createDomain
      security: [{ session: [] }]
      responses:
        "201": { description: Created }
        "409": { description: Hostname already in use }

  /projects/{name}/domains/{hostname}:
    delete:
      summary: Remove a domain (member)
      operationId: deleteDomain
      security: [{ session: [] }]
      responses:
        "204": { description: Removed; routes re-synced }

  /projects/{name}/backups:
    get:
      summary: List backups
      operationId: listBackups
      security: [{ session: [] }]
      responses:
        "200": { description: Array of backups }
    post:
      summary: Back up now (member) — archive + best-effort DB dump
      operationId: createBackup
      security: [{ session: [] }]
      responses:
        "201": { description: Backup record }

  /projects/{name}/backups/{id}/restore:
    post:
      summary: Restore a backup's files over the project directory (member)
      operationId: restoreBackup
      security: [{ session: [] }]
      responses:
        "204": { description: Restored; deploy to apply }

  /projects/{name}/backups/schedule:
    get:
      summary: Get the backup schedule
      operationId: getBackupSchedule
      security: [{ session: [] }]
      responses:
        "200": { description: "{interval, destination, retention_count, enabled}" }
    put:
      summary: Set the backup schedule (member; hourly|daily|weekly)
      operationId: setBackupSchedule
      security: [{ session: [] }]
      responses:
        "204": { description: Saved }

  /registries:
    get:
      summary: List container registry credentials (admin; secrets never returned)
      operationId: listRegistryCredentials
      security: [{ session: [] }]
      responses:
        "200": { description: Array of credentials }
    put:
      summary: >-
        Store a registry credential and log the host in with it (admin).
        Applied with a real docker login, so the host can pull whether or not
        Windlass is running.
      operationId: saveRegistryCredential
      security: [{ session: [] }]
      responses:
        "200":
          description: >-
            Saved. Carries a warning when the credential was stored but the
            login did not succeed.

  /registries/from-git/{id}:
    post:
      summary: >-
        Fill in a ghcr.io credential from an existing GitHub connection (admin).
        An explicit action, not something that happens when a repository is
        connected.
      operationId: registryCredentialFromGit
      security: [{ session: [] }]
      responses:
        "200":
          description: >-
            Stored. verified_at is empty when the connection's token cannot pull
            packages, which the screen shows as never signed in.

  /registries/{id}:
    delete:
      summary: Delete a registry credential (admin)
      operationId: deleteRegistryCredential
      security: [{ session: [] }]
      responses:
        "204": { description: Deleted }

  /git/connections:
    get:
      summary: List git connections (admin)
      operationId: listGitConnections
      security: [{ session: [] }]
      responses:
        "200": { description: Array of connections (tokens never returned) }
    post:
      summary: Add a git connection (admin; token stored encrypted)
      operationId: createGitConnection
      security: [{ session: [] }]
      responses:
        "201": { description: Created }

  /git/connections/{id}:
    delete:
      summary: Delete a git connection (admin)
      operationId: deleteGitConnection
      security: [{ session: [] }]
      responses:
        "204": { description: Deleted }

  /git/connections/{id}/repos:
    get:
      summary: List repositories the connection's token can access (admin)
      operationId: listGitConnectionRepos
      security: [{ session: [] }]
      responses:
        "200": { description: "Array of {full_name, clone_url, default_branch, private}" }
        "502": { description: Provider API unreachable or rejected the token }

  /git/connections/github/setup:
    get:
      summary: GitHub App installation landing — turns the installation into a git connection (admin)
      operationId: githubAppSetup
      security: [{ session: [] }]
      responses:
        "302": { description: Redirect to Settings → Git }

  /git/connections/github/connect:
    get:
      summary: Begin one-click GitHub connect using the instance's OAuth app with repo scope (admin)
      operationId: gitConnectStart
      security: [{ session: [] }]
      responses:
        "302": { description: Redirect to GitHub authorize }
        "400":
          description: GitHub OAuth app not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /templates:
    get:
      summary: List one-click database templates
      operationId: listTemplates
      security: [{ session: [] }]
      responses:
        "200": { description: Array of templates }

  /templates/{key}:
    post:
      summary: Create + deploy a database project from a template (member)
      operationId: createFromTemplate
      security: [{ session: [] }]
      responses:
        "201": { description: "{project, deployment}; credentials in project env" }

  /plugins:
    get:
      summary: List discovered plugins
      operationId: listPlugins
      security: [{ session: [] }]
      responses:
        "200": { description: Array of plugins with enabled/running state }

  /plugins/{name}/enable:
    post:
      summary: Enable and start a plugin (admin)
      operationId: enablePlugin
      security: [{ session: [] }]
      responses:
        "204": { description: Running }

  /plugins/{name}/disable:
    post:
      summary: Disable and stop a plugin (admin)
      operationId: disablePlugin
      security: [{ session: [] }]
      responses:
        "204": { description: Stopped; zero residual footprint }

  /plugins/{name}/proxy:
    get:
      summary: Reverse proxy to the plugin process (all methods)
      operationId: pluginProxy
      security: [{ session: [] }]
      responses:
        "503": { description: Plugin not running }

  /plugins/{name}/proxy/{path}:
    get:
      summary: Reverse proxy to the plugin process (all methods, any subpath)
      operationId: pluginProxyPath
      security: [{ session: [] }]
      responses:
        "503": { description: Plugin not running }

  /openapi.yaml:
    get:
      summary: This document
      operationId: openapi
      responses:
        "200": { description: OpenAPI 3.1 spec (YAML) }
