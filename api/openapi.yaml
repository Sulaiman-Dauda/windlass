openapi: 3.1.0
info:
  title: Windlass API
  description: |
    HTTP API of the Windlass Docker Compose control plane. All endpoints are
    versioned under /api/v1. The panel authenticates with an HTTP-only
    session cookie obtained from /auth/login or /auth/setup. Scripts and
    agents use a personal API token (`Authorization: Bearer wl_pat_...`),
    created by an admin in Settings. A token acts as its owner with the role
    capped at its scope (read = viewer, write = member, admin = admin). A
    deploy token acts as a viewer that may also call five routes, marked
    "(member, or a deploy token)": deploy, roll back, promote, restart and
    back up. It needs an owner who is a member or admin.
    Operations whose only security scheme is `session` refuse tokens with
    403 `session_required`.
  version: 0.1.0
servers:
  - url: /api/v1

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: windlass_session
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal API token, `wl_pat_` followed by 60 hex characters.
  schemas:
    JSONRPCRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          oneOf: [{ type: string }, { type: integer }]
          description: Absent for a notification
        method: { type: string, example: tools/list }
        params: { type: object, additionalProperties: true }
    JSONRPCResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc: { type: string, enum: ["2.0"] }
        id:
          type: [string, integer, "null"]
        result: { type: object, additionalProperties: true }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: integer }
            message: { type: string }
            data: {}
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
    User:
      type: object
      required: [id, email, role]
      properties:
        id: { type: integer }
        email: { type: string, format: email }
        role: { type: string, enum: [admin, member, viewer] }
        totp_enabled: { type: boolean }
        has_password:
          type: boolean
          description: False for OAuth-only accounts; such users skip password re-entry on destructive actions.
    AuthStatus:
      type: object
      required: [needs_setup, authenticated]
      properties:
        needs_setup: { type: boolean }
        authenticated: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
    APIToken:
      type: object
      required: [id, name, prefix, scope, can_read_secrets, expires_at, expired, created_at]
      properties:
        id: { type: integer }
        name: { type: string }
        prefix:
          type: string
          description: The non-secret start of the token (`wl_pat_` and the public id), for recognising it.
        scope: { type: string, enum: [read, deploy, write, admin] }
        can_read_secrets:
          type: boolean
          description: Whether the token sees real env values. Without it, env reads come back masked.
        expires_at: { type: string, format: date-time }
        expired: { type: boolean }
        last_used_at: { type: [string, "null"], format: date-time }
        last_used_ip: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        revoked_at: { type: [string, "null"], format: date-time }
    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string }
        version: { type: string }
    Domain:
      type: object
      required: [hostname, service, container_port, status]
      properties:
        hostname: { type: string, example: app.example.com }
        service: { type: string, example: web }
        container_port: { type: integer, example: 3000 }
        status:
          type: string
          enum: [active, pending, proxy_unavailable]
          description: |
            active is routed now; pending has no running container yet;
            proxy_unavailable means Caddy is down.
    Deployment:
      type: object
      required: [id, number, status, triggered_by, created_at]
      properties:
        id: { type: integer }
        number: { type: integer }
        status:
          type: string
          enum: [queued, preparing, syncing, pulling, building, applying, verifying, succeeded, failed, cancelled]
        triggered_by: { type: string }
        git_commit: { type: string }
        error: { type: string }
        failed_step:
          type: string
          enum: [preparing, syncing, pulling, building, applying, verifying]
          description: The step a failed deployment stopped in. Absent before v0.62.
        exit_code:
          type: integer
          description: The failing command's exit code, when a command failed with one.
        error_line:
          type: string
          example: "failed to solve: process \"/bin/sh -c npm ci\" did not complete successfully: exit code: 1"
          description: |
            The last line of the failing step's output that reads as an error, or
            the first line of error when there was none. Show it first.
        started_at: { type: string }
        finished_at: { type: string }
        created_at: { type: string }
        promoted_from_number: { type: integer }
    Backup:
      type: object
      required: [id, kind, destination, size, status, created_at]
      properties:
        id: { type: integer }
        kind: { type: string, example: manual }
        destination: { type: string, enum: [local, s3] }
        size: { type: integer, description: Archive size in bytes }
        status: { type: string, enum: [pending, done, failed] }
        error: { type: string }
        db_dump:
          type: string
          enum: [included, failed, none]
          description: |
            Whether the archive holds a database dump. failed means the project
            has a database container or compose service and no dump was taken;
            none means neither was found. Absent for backups taken before
            v0.62, which did not record it.
        db_dump_error:
          type: string
          example: database container shop-db-1 is not running
          description: Why the dump was not taken, when db_dump is failed.
        created_at: { type: string }

paths:
  /system/health:
    get:
      summary: Liveness and version
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /auth/status:
    get:
      summary: Bootstrap and session state
      description: Public. Drives the frontend's setup/login/app routing.
      operationId: getAuthStatus
      responses:
        "200":
          description: Current auth state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStatus" }

  /auth/setup:
    post:
      summary: First-run admin creation
      description: |
        Claims a fresh instance using the one-time setup token printed to the
        server log at first start. Creates the admin account and signs the
        caller in. Fails once any user exists.
      operationId: setupAdmin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, email, password]
              properties:
                token: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 10 }
      responses:
        "204": { description: Admin created, session cookie set }
        "400": { description: "bad_request: invalid body, email or password" }
        "403":
          description: Invalid token (invalid_token) or instance already claimed (setup_complete)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { description: "rate_limited: more than 20 credential attempts from this address in a minute" }
        "503": { description: "busy: every password check slot stayed taken for 10 seconds; try again" }

  /auth/login:
    post:
      summary: Sign in with email and password
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
                totp_code:
                  type: string
                  description: A current authenticator code, for accounts with TOTP
      responses:
        "204": { description: Session cookie set }
        "401":
          description: invalid_credentials, totp_required (send totp_code) or totp_invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { description: "rate_limited: more than 20 credential attempts from this address in a minute" }
        "503": { description: "busy: every password check slot stayed taken for 10 seconds; try again" }

  /auth/logout:
    post:
      summary: Sign out
      operationId: logout
      description: Ends the session in the cookie, if there is one. It does not revoke API tokens.
      security: [{ session: [] }, {}]
      responses:
        "204": { description: Session revoked, cookie cleared }

  /auth/me:
    get:
      summary: Current user
      operationId: getMe
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The authenticated user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/totp/setup:
    post:
      summary: Begin TOTP enrollment; returns secret + otpauth URL
      operationId: totpSetup
      security: [{ session: [] }]
      responses:
        "200": { description: "{secret, otpauth_url}" }
        "409": { description: "totp_enabled: TOTP is already on; turn it off with a code first" }

  /auth/totp/verify:
    post:
      summary: Confirm enrollment with a code; activates TOTP
      operationId: totpVerify
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204": { description: TOTP enabled }
        "400": { description: "totp_invalid: the code was wrong, or enrolment was not started" }

  /auth/totp/disable:
    post:
      summary: Disable TOTP for the current user; needs a current code
      operationId: totpDisable
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, description: A current code from the authenticator app }
      responses:
        "204": { description: TOTP disabled }
        "400": { description: "totp_invalid: the code was wrong" }
        "429": { description: "rate_limited: more than 20 credential attempts from this address in a minute" }

  /auth/oauth/providers:
    get:
      summary: Which OAuth providers are configured (public)
      operationId: oauthProviders
      responses:
        "200": { description: "{github: bool, google: bool}" }

  /auth/oauth/{provider}/start:
    get:
      summary: Begin OAuth sign-in (redirects to the provider)
      operationId: oauthStart
      responses:
        "302": { description: Redirect to provider }

  /auth/oauth/{provider}/callback:
    get:
      summary: OAuth callback, signs in EXISTING users by verified email
      operationId: oauthCallback
      responses:
        "302": { description: "Redirect to the app (or /?oauth_error=...). An account with TOTP is sent to /?signin=totp with a five-minute ticket cookie instead of a session." }

  /auth/oauth/totp:
    post:
      summary: Finish an OAuth sign-in for an account with TOTP, using the ticket cookie set by the callback
      operationId: oauthTOTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        "204": { description: Signed in; session cookie set }
        "401": { description: "totp_expired (no ticket or it timed out), totp_required or totp_invalid" }
        "429": { description: "rate_limited: more than 20 credential attempts from this address in a minute" }

  /auth/oauth/github/callback/git:
    get:
      summary: GitHub callback for the repo-scope connect flow (admin); stores the token as a git connection
      operationId: gitConnectCallback
      security: [{ session: [] }]
      responses:
        "302": { description: "Redirect to /settings?git_connected=... (or ?git_error=...)" }

  /users:
    get:
      summary: List users (admin)
      operationId: listUsers
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Array of users }
    post:
      summary: Create a user (admin); omit password for OAuth-only accounts
      operationId: createUser
      security: [{ session: [] }]
      responses:
        "201": { description: Created }
        "503": { description: "busy: every password check slot stayed taken for 10 seconds; try again" }

  /users/{id}/role:
    put:
      summary: Change a user's role (admin; self-demotion refused)
      operationId: setUserRole
      security: [{ session: [] }]
      responses:
        "204": { description: Updated }

  /users/{id}/totp:
    delete:
      summary: Turn off another user's TOTP so they can sign in and enrol again (admin; your own account refused)
      operationId: resetUserTOTP
      security: [{ session: [] }]
      responses:
        "204": { description: TOTP turned off }
        "400": { description: "own_account: turn your own off in Settings with a code" }
        "404": { description: No such user }

  /users/{id}:
    delete:
      summary: Delete a user (admin; self-deletion refused)
      operationId: deleteUser
      security: [{ session: [] }]
      responses:
        "204": { description: Deleted }

  /auth/tokens:
    get:
      summary: List your own API tokens, including revoked and expired ones
      operationId: listTokens
      security: [{ session: [] }]
      responses:
        "200":
          description: Tokens, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/APIToken" } }
    post:
      summary: Create an API token (admin). The token is in the response once and never again.
      operationId: createToken
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, scope]
              properties:
                name: { type: string, maxLength: 100 }
                scope:
                  type: string
                  enum: [read, deploy, write, admin]
                  description: |
                    Highest role the token acts as; cannot exceed your own. deploy
                    needs a member or admin and acts as a viewer plus the five
                    deploy routes. can_read_secrets has no effect on read or deploy.
                expires_in_days: { type: integer, minimum: 1, maximum: 365, default: 90 }
                can_read_secrets: { type: boolean, default: false }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/APIToken" }
                  - type: object
                    required: [token]
                    properties:
                      token: { type: string, description: "The full token. Store it now." }
        "400": { description: Invalid name, scope or expiry }
        "403": { description: Not an admin, scope above your role, or called with a token }

  /auth/tokens/{id}:
    delete:
      summary: Revoke one of your API tokens (idempotent)
      operationId: revokeToken
      security: [{ session: [] }]
      responses:
        "204": { description: Revoked }
        "404": { description: No such token of yours }

  /auth/tokens/current:
    get:
      summary: The API token making this request, and the user it acts as
      operationId: getCurrentToken
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Token details with the effective (capped) user
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/APIToken" }
                  - type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
                      can_deploy:
                        type: boolean
                        description: |
                          Whether the deploy, rollback, promote, restart and backup
                          routes accept this token now: scope deploy, write or admin,
                          with an owner who is a member or admin.
        "404": { description: The request used a session, not a token }

  /mcp:
    post:
      summary: Model Context Protocol server for AI agents
      description: |
        Streamable HTTP, stateless: one JSON-RPC 2.0 request per POST, answered
        with JSON. No sessions, no server-sent events, no batches. Takes an API
        token only, never the session cookie, and refuses any request with an
        Origin header. The methods are defined by the MCP specification; see
        docs/mcp.md for the tools and the protocol revisions accepted. GET and
        DELETE answer 405.
      operationId: mcp
      security: [{ bearerAuth: [] }]
      parameters:
        - name: MCP-Protocol-Version
          in: header
          required: false
          schema: { type: string, example: "2025-11-25" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/JSONRPCRequest" }
      responses:
        "200":
          description: A JSON-RPC result, or a JSON-RPC error for a tool or params problem
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JSONRPCResponse" }
        "202": { description: A notification was accepted; no body }
        "400":
          description: Not a JSON-RPC request, a batch, bad params or an unsupported protocol version
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JSONRPCResponse" }
        "401":
          description: No API token, or the request used only a session cookie
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: The request carried an Origin header
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JSONRPCResponse" }
        "404":
          description: Unknown method
          content:
            application/json:
              schema: { $ref: "#/components/schemas/JSONRPCResponse" }
        "405": { description: GET or DELETE }
        "413": { description: Body over 1 MiB }
        "503": { description: The server is still starting }

  /mcp/tools:
    get:
      summary: The tools an AI agent connected to /mcp can call
      description: |
        The MCP tool catalogue in the order tools/list returns it, for the
        panel's AI agents page. A token sees in tools/list only the tools its
        scope allows; this list shows them all.
      operationId: listMCPTools
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Tools in catalogue order
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [name, summary, needs, destructive]
                  properties:
                    name: { type: string, example: list_projects }
                    summary: { type: string, example: List projects }
                    needs:
                      type: string
                      enum: [read, deploy]
                      description: read for any token; deploy for a token that can deploy
                    destructive:
                      type: boolean
                      description: Changes what is running; needs confirm true

  /mcp/endpoint:
    get:
      summary: The HTTPS address an AI agent should connect to
      description: |
        The MCP endpoint under the panel domain, for any signed-in user. url
        is empty when no panel domain is set or Caddy is unreachable; the AI
        agents page then uses the address the browser reached the panel on.
      operationId: getMCPEndpoint
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: The endpoint
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, example: "https://windlass.example.com/api/v1/mcp" }
        "401": { description: Not signed in }

  /users/{id}/tokens:
    get:
      summary: List a user's API tokens (admin)
      operationId: listUserTokens
      security: [{ session: [] }]
      responses:
        "200":
          description: Tokens, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/APIToken" } }

  /users/{id}/tokens/{tokenID}:
    delete:
      summary: Revoke another user's API token (admin)
      operationId: revokeUserToken
      security: [{ session: [] }]
      responses:
        "204": { description: Revoked }
        "404": { description: No such token for that user }

  /system/oauth/{provider}:
    put:
      summary: Configure an OAuth provider's client credentials (admin)
      operationId: setOAuthConfig
      security: [{ session: [] }]
      responses:
        "204": { description: Saved encrypted }

  /webhooks/github-app:
    post:
      summary: GitHub App push webhook, fans out to all matching projects (public, signature-verified)
      operationId: githubAppWebhook
      responses:
        "200": { description: "{result, deployed[]}" }
        "403": { description: Invalid signature }

  /webhooks/{provider}/{project}:
    post:
      summary: Git push webhook (public, signature-verified)
      operationId: webhook
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string, enum: [github, gitlab] } }
        - { name: project, in: path, required: true, schema: { type: string } }
      responses:
        "201": { description: Deployment triggered }
        "200": { description: Ignored (branch mismatch or auto-deploy off) }
        "202": { description: Skipped, a deployment is already running }
        "403": { description: Signature verification failed }

  /events:
    get:
      summary: Global platform event stream (SSE)
      operationId: globalEvents
      security: [{ session: [] }, { bearerAuth: [] }]
      parameters:
        - { name: topics, in: query, schema: { type: string }, description: Comma-separated topic filter }
      responses:
        "200":
          description: text/event-stream of platform events

  /proxy/status:
    get:
      summary: Caddy availability
      operationId: proxyStatus
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{available, version}" }

  /system/metrics:
    get:
      summary: Host, node, container and panel metrics
      operationId: systemMetrics
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{host, node, containers, panel: {rss_bytes, history: [{time, rss_bytes}]}}" }

  /system/preflight:
    get:
      summary: First-run checks of this server
      description: |
        Read only. Docker through the socket proxy, Docker Compose, Caddy,
        whether anything answers on local ports 80 and 443, whether the panel
        was opened over plain HTTP from another machine, and free disk (warns
        under 5 GiB). It cannot see a firewall in front of the server. Before
        the instance is claimed, the X-Setup-Token header opens it; afterwards
        only an admin may read it. Limited to 20 a minute per IP, apart from sign-in.
      operationId: systemPreflight
      security: [{}, { session: [] }, { bearerAuth: [] }]
      parameters:
        - { name: X-Setup-Token, in: header, required: false, schema: { type: string } }
      responses:
        "200": { description: "{version, checks: [{id, status: ok|warn|fail, title, detail}]}" }
        "403": { description: Neither a valid setup token nor an admin }

  /system/attention:
    get:
      summary: What needs a person (Needs you list)
      description: |
        Projects whose last deploy failed, the projects disk at or over its
        threshold (setting attention_disk_percent, default 85), projects with
        volumes and no enabled backup schedule, Caddy not answering while a
        domain needs it, and (admins only) a panel update. Cached for 30
        seconds. Items are sorted error, warn, info.
      operationId: systemAttention
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{checked_at, items: [{kind, tone, project, title, detail, link, action}]}" }

  /system/disk:
    get:
      summary: Disk use of the projects volume and of Docker by kind
      description: Docker's figures are cached for 5 minutes, since counting volume sizes is slow.
      operationId: systemDisk
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{host: {used_bytes, total_bytes}, docker: {images, containers, volumes, build_cache}, checked_at}" }

  /system/update:
    get:
      summary: Check for a panel update (admin)
      operationId: checkUpdate
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{version, current_version, update_available, apply_supported}" }
    post:
      summary: Apply the available update (admin)
      operationId: applyUpdate
      security: [{ session: [] }]
      responses:
        "200": { description: Update applied; panel restarts }
        "400": { description: Self-update unsupported in this install mode }

  /system/docker/images:
    get:
      summary: Docker image disk usage (admin)
      operationId: imageDiskUsage
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Image counts and reclaimable bytes }

  /system/docker/images/prune:
    post:
      summary: Remove old unused images while protecting recent deployments (admin)
      operationId: pruneImages
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "Deleted and failed image counts, reclaimed bytes, and the first few reasons an image could not be removed" }

  /system/docker/cleanup:
    get:
      summary: Disk clean-up settings and the last run (admin)
      operationId: getDiskCleanup
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{settings, defaults, last}; last is null before the first run, and its skipped field says why an automatic run did nothing" }
    put:
      summary: Set the disk clean-up that runs after each successful deployment (admin)
      operationId: setDiskCleanup
      security: [{ session: [] }, { bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [auto, image_days, keep_deployments, build_cache_gb]
              properties:
                auto: { type: boolean, description: Run after each successful deployment }
                image_days: { type: integer, minimum: 1, maximum: 3650, description: Keep unused images younger than this }
                keep_deployments: { type: integer, minimum: 1, maximum: 100, description: Keep the images of each project's last N successful deployments }
                build_cache_gb: { type: integer, minimum: 0, maximum: 10000, description: Build cache left after a trim, in GB (10^9 bytes); 0 removes all unused cache }
      responses:
        "200": { description: The saved settings and the last run }
        "400": { description: A setting is missing or out of range }

  /system/docker/cleanup/run:
    post:
      summary: Remove unused images and trim build cache now, with the saved settings (admin)
      operationId: runDiskCleanup
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "The run: images removed and failed, build cache reclaimed, and any errors" }
        "409": { description: A clean-up or a deployment is already running }

  /system/panel-domain:
    get:
      summary: Get the Settings-managed panel hostname (admin)
      operationId: getPanelDomain
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Hostname, HTTPS URL, and Caddy availability }
    put:
      summary: Configure or remove the panel hostname in Caddy (admin)
      description: Set hostname to an empty string to remove only the Windlass-owned panel route.
      operationId: setPanelDomain
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostname]
              properties:
                hostname: { type: string, example: windlass.example.com }
      responses:
        "200": { description: Desired hostname stored and applied }
        "400": { description: Invalid hostname }
        "409": { description: A project already routes this hostname }

  /system/backups/s3:
    get:
      summary: S3 backup destination status (admin; never returns the keys)
      operationId: getS3Config
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{configured, endpoint, region, bucket, key_prefix}" }
    put:
      summary: Configure the S3 backup destination (admin); replaces the stored one, keys included
      operationId: setS3Config
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, bucket, access_key, secret_key]
              properties:
                endpoint: { type: string, description: "Path-style endpoint without the bucket, e.g. https://s3.eu-west-2.amazonaws.com" }
                region: { type: string, description: "Blank means auto" }
                bucket: { type: string }
                access_key: { type: string }
                secret_key: { type: string }
                key_prefix: { type: string, description: "Prepended to every object key, e.g. windlass/" }
      responses:
        "204": { description: Saved (credentials stored encrypted) }
        "400": { description: "bad_request: endpoint, bucket, access_key and secret_key are required" }

  /projects:
    get:
      summary: List projects
      operationId: listProjects
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Array of projects }
    post:
      summary: Create a project (member)
      operationId: createProject
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "201": { description: Created with a starter compose.yaml on disk }
        "409": { description: Name already exists }

  /projects/{name}:
    get:
      summary: Get a project
      operationId: getProject
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Project }
        "404": { description: Not found }
    delete:
      summary: Delete a project, containers stopped, directory removed (member; requires password re-entry unless the account is OAuth-only)
      description: |
        Deleting a staging also removes its volumes (compose down -v); a live
        project keeps them. A live project that has a staging cannot be
        deleted until the staging is.
      operationId: deleteProject
      security: [{ session: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: The caller's account password. Required when the account has one.
      responses:
        "204": { description: Deleted }
        "403":
          description: Password missing (password_required) or wrong (invalid_password)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { description: "has_staging: delete the project's staging first; shared_volume: a staging's compose file names a volume with a fixed name: that deleting would remove" }
        "429": { description: "rate_limited: more than 20 credential attempts from this address in a minute" }
        "503": { description: "busy: every password check slot stayed taken for 10 seconds; try again" }

  /projects/scan:
    post:
      summary: Scan the stacks directory and rebuild the project index (member)
      operationId: scanProjects
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{count, skipped, conflicts}: projects indexed; directories with a Compose file that were not picked up, each {name, reason}; and stacks a first deploy would refuse, each {project, running_as, working_dir, containers, new_volumes, message}" }

  /projects/{name}/files:
    get:
      summary: List project files
      operationId: listProjectFiles
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Array of file infos }

  /projects/{name}/files/{path}:
    get:
      summary: Read an editable file (yaml/env/conf/json/toml/txt/md). For viewers and tokens without can_read_secrets, dotenv values and Compose inline environment, build args and config content are masked
      operationId: readProjectFile
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{path, content}" }
    put:
      summary: Write an editable file (member; 1MiB cap)
      operationId: writeProjectFile
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Written atomically }
        "400": { description: "masked_values: a dotenv or YAML file still holding ******** from a masked read, sent by a caller who cannot read secrets" }

  /projects/{name}/env:
    get:
      summary: Read env vars (decrypted for members and admins; viewers and tokens without can_read_secrets get values masked)
      operationId: getProjectEnv
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "Object of KEY: value" }
    put:
      summary: Replace env vars (member; stored AES-256-GCM encrypted; a value of ******** from a masked read keeps the stored value)
      operationId: setProjectEnv
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Saved }

  /system/github-app:
    get:
      summary: GitHub App status (admin)
      operationId: githubAppStatus
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{configured, slug?, owner?, html_url?}" }

  /system/github-app/create:
    get:
      summary: Begin the two-click GitHub App manifest flow (admin)
      operationId: githubAppCreate
      security: [{ session: [] }]
      responses:
        "200": { description: Auto-submitting manifest form redirecting to GitHub }

  /system/github-app/callback:
    get:
      summary: Manifest conversion callback, stores app credentials and enables sign-in (admin)
      operationId: githubAppCallback
      security: [{ session: [] }]
      responses:
        "302": { description: Redirect to Settings → Users & auth }

  /projects/{name}/git:
    put:
      summary: Configure git source (member); returns webhook secret once
      operationId: configureProjectGit
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{webhook_secret, webhook_url, webhook_registered}" }

  /projects/{name}/services:
    get:
      summary: Live service status (compose ps)
      operationId: projectServices
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{services, note?}" }

  /projects/{name}/logs:
    get:
      summary: Container log stream (SSE)
      description: |
        Without service, every container of the project is shown, merged by
        Docker's timestamps; a service scaled to several containers is merged
        the same way. tail is the history sent in all, at most 5000 lines when
        merged. Each "log" event is
        {stream, text, time, service, container}.
      operationId: projectLogs
      security: [{ session: [] }, { bearerAuth: [] }]
      parameters:
        - { name: service, in: query, schema: { type: string } }
        - { name: follow, in: query, schema: { type: boolean, default: true } }
        - { name: tail, in: query, schema: { type: integer, default: 200 } }
      responses:
        "200": { description: text/event-stream of log lines }

  /projects/{name}/drift:
    get:
      summary: Containers that no longer match the project's files or images (read-only)
      description: |
        Compares each container's Compose config hash with `docker compose
        config --hash` for the files the live deploy used, and its image with
        the local image its tag names now. Nothing is pulled or recreated.
      operationId: projectDrift
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{project, checked_at, drifted, extra_files, services: [{service, container, config_changed, image_changed, missing, orphan}]}" }
        "404": { description: Project not found }
        "502": { description: Compose or Docker could not be read }

  /projects/{name}/terminal:
    get:
      summary: Interactive terminal (WebSocket; member)
      description: |
        JSON text frames in ({"type":"input","data":...} / {"type":"resize",...}),
        raw binary terminal output frames out.
      operationId: projectTerminal
      security: [{ session: [] }]
      responses:
        "101": { description: Switching protocols }

  /projects/{name}/actions/{action}:
    post:
      summary: start | stop | restart (member)
      operationId: projectAction
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Done }
        "502": { description: Compose command failed }

  /projects/{name}/actions/restart:
    post:
      summary: docker compose restart (member, or a deploy token)
      description: |
        The restart action on its own route, so a deploy token can restart a
        project without being able to start or stop it.
      operationId: restartProject
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Done }
        "404": { description: "not_found: no such project" }
        "502": { description: Compose command failed }

  /projects/{name}/deployments:
    get:
      summary: List deployments
      operationId: listDeployments
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Array of deployments, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Deployment" } }
    post:
      summary: Deploy (member, or a deploy token)
      operationId: createDeployment
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "201": { description: Deployment queued }
        "409": { description: "A deployment is already running (code conflict), or this is the first deploy and a stack started from this directory runs under another Compose project name, so deploying would start a second copy with empty volumes (code adoption_conflict, the message says how to fix it)" }

  /projects/{name}/deployments/{number}:
    get:
      summary: Get a deployment
      operationId: getDeployment
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Deployment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Deployment" }

  /projects/{name}/deployments/{number}/events:
    get:
      summary: Deployment event stream (SSE, replay + live, Last-Event-ID)
      operationId: deploymentEvents
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: text/event-stream; closes after terminal replay }

  /projects/{name}/deployments/{number}/rollback:
    post:
      summary: Roll back to this succeeded deployment (member, or a deploy token)
      description: |
        Queues a new deployment. Pulled services are pinned to this deployment's
        recorded image digests. On a Git project its commit is checked out and
        services with a build key are rebuilt from it; without Git they keep
        their current image. The current compose file and .env are used.
      operationId: rollback
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "201": { description: Rollback deployment queued }
        "400": { description: "bad_request: the deployment did not succeed, or has no image digests or Git commit" }
        "404": { description: "not_found: no such deployment" }
        "409": { description: "conflict: a deployment is already running" }

  /projects/{name}/deployments/{number}/promote:
    post:
      summary: Promote this staging deployment to live (member, or a deploy token)
      description: |
        Called on the staging project. Queues a live deployment that runs the
        commit and image digests this succeeded staging deployment ran,
        through the rollback path. The commit must be on live's branch.
        Digests are kept only for services live's compose file defines.
      operationId: promote
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "201": { description: "Live deployment queued, with promoted_from_number" }
        "404": { description: "not_found: no such deployment" }
        "409": { description: "conflict: live is deploying; not_promotable: the reason, such as a commit not on live's branch" }

  /projects/{name}/staging/preflight:
    post:
      summary: Check a project for a staging copy (member)
      description: |
        Changes nothing. Returns blockers with their fix, warnings, environment
        values that probably reach the outside world (masked without secrets
        access), the default staging domains and hostname rewrites, what a
        data copy moves with sizes, and the free disk. The optional body is the
        create request, to check the person's choices.
      operationId: stagingPreflight
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{blockers, warnings, flagged_env, domains, rewrites, data, projects_free_bytes, docker_free_bytes, can_create}" }
        "404": { description: Not found }

  /projects/{name}/staging:
    get:
      summary: Compare a project with its staging
      description: |
        name may be the live project or its staging. Returns both deployments,
        the promotable staging deployment or why Promote is unavailable, the
        hostname rewrites and the compose files that differ.
      operationId: getStaging
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{live, staging, auto_promote, live_current, promotable, promote_blocked, can_recreate, recreate_flagged_keys?, rewrites, drift, commits?, commits_more?, branch_head?, env_missing?}; can_recreate is true only for an interrupted first data-copy deployment; recreate_flagged_keys lists only the current staging key names to review, never their values; commits ({hash, subject, author, time}, newest first, at most 50) are what Promote brings to live, absent when live's commit is not in staging's history; branch_head is staging's branch at the remote, read in the background at most once a minute and absent until it has an answer or when the remote cannot be reached; env_missing names the .env keys staging has and live lacks, never their values, and is absent when either .env cannot be read" }
        "404": { description: The project has no staging }
    post:
      summary: Create the project's staging (member)
      description: |
        Copies live's files, environment and, with copy_data, its volumes and
        database into <name>-staging, gives it its own domains and queues its
        first deployment. From then on pushes deploy staging, not live.
        acknowledged is required when the preflight flags environment values.
      operationId: createStaging
      security: [{ session: [] }, { bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                branch: { type: string }
                domains:
                  type: array
                  items:
                    type: object
                    properties:
                      live: { type: string }
                      staging: { type: string }
                env: { type: object, additionalProperties: { type: string } }
                copy_data: { type: boolean }
                auto_promote: { type: boolean }
                acknowledged: { type: boolean }
      responses:
        "201": { description: "{project, result: {deployment, rewritten, skipped, webhook_secret?, webhook_registered}}" }
        "400": { description: "acknowledgement_required, or bad_request" }
        "404": { description: Not found }
        "409": { description: "staging_blocked: the preflight found a blocker; conflict: the staging already exists" }
    put:
      summary: Change a staging's settings (member)
      description: Called on the staging project.
      operationId: updateStaging
      security: [{ session: [] }, { bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [auto_promote]
              properties:
                auto_promote: { type: boolean }
      responses:
        "204": { description: Updated }
        "404": { description: The project is not a staging }

  /projects/{name}/staging/recreate:
    post:
      summary: Recreate staging after its interrupted first data copy (member, session only)
      description: |
        Called on staging, only when its latest deployment is number 1 and failed with
        "data copy was interrupted; delete staging and create it again". Retains its
        branch, domains, environment, hostname rewrites and auto-promote setting, deletes
        staging through the existing guarded deletion path, then creates it again with
        a fresh preflight and data copy from live. A failed container/volume removal
        leaves the old staging in place. A failure after deletion may leave no staging.
        Audited as project.staging_recreate. API tokens cannot call this endpoint.
      operationId: recreateStaging
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  description: The caller's account password, required when the account has one.
                acknowledged:
                  type: boolean
                  description: Confirms reuse of staging's environment values; required when they include flagged values.
      responses:
        "201": { description: "{project, result: {deployment, rewritten, skipped, webhook_secret?, webhook_registered}}" }
        "400": { description: "acknowledgement_required, or invalid JSON" }
        "403": { description: "forbidden, session_required, password_required, or invalid_password" }
        "404": { description: Project not found }
        "409": { description: "not_recreatable, shared_volume, or staging_blocked" }
        "429": { description: Credential attempt rate limit exceeded }
        "503": { description: Password check capacity exhausted }

  /projects/{name}/staging/diff/{file}:
    get:
      summary: One compose file from live and from staging (member)
      description: |
        name may be the live project or its staging. for_live is staging's
        file with the staging hostnames put back to live's, which is what
        writing it to live with PUT /projects/{live}/files/{file} copies
        across. A side without the file is an empty string. Values are not
        masked, so this is member only.
      operationId: stagingDiff
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{file, live, for_live}" }
        "400": { description: Not a compose file the drift list compares }
        "404": { description: The project has no staging }

  /projects/{name}/domains:
    get:
      summary: List domains with routing status
      operationId: listDomains
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Array of domains
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Domain" } }
    post:
      summary: Add a domain (member), Caddy routes + automatic HTTPS
      operationId: createDomain
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "201":
          description: The created domain, in the same shape as a list item
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Domain" }
        "409": { description: "Hostname already in use, by a project or by the panel" }

  /projects/{name}/domains/{hostname}:
    delete:
      summary: Remove a domain (member)
      operationId: deleteDomain
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Removed; routes re-synced }

  /projects/{name}/backups:
    get:
      summary: List backups
      operationId: listBackups
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: Array of backups, newest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Backup" } }
    post:
      summary: Back up now (member, or a deploy token), archive + best-effort DB dump
      operationId: createBackup
      security: [{ session: [] }, { bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                destination: { type: string, enum: [local, s3], description: "Defaults to local" }
      responses:
        "201":
          description: Backup record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backup" }
        "400": { description: The body is not valid JSON }
        "409": { description: "conflict: a backup of this project is already running" }
        "502": { description: "The backup failed; the body is the failed backup record with its error" }

  /projects/{name}/backups/{id}/restore:
    post:
      summary: Restore a backup's files over the project directory (member)
      operationId: restoreBackup
      security: [{ session: [] }]
      responses:
        "204": { description: Restored; deploy to apply }

  /projects/{name}/backups/schedule:
    get:
      summary: Get the backup schedule
      operationId: getBackupSchedule
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "{interval, destination, retention_count, enabled}" }
    put:
      summary: Set the backup schedule (member; hourly|daily|weekly)
      operationId: setBackupSchedule
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Saved }

  /registries:
    get:
      summary: List container registry credentials (admin; secrets never returned)
      operationId: listRegistryCredentials
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Array of credentials }
    put:
      summary: >-
        Store a registry credential and log the host in with it (admin).
        Applied with a real docker login, so the host can pull whether or not
        Windlass is running.
      operationId: saveRegistryCredential
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: >-
            Saved. Carries a warning when the credential was stored but the
            login did not succeed.

  /registries/from-git/{id}:
    post:
      summary: >-
        Fill in a ghcr.io credential from an existing GitHub connection (admin).
        An explicit action, not something that happens when a repository is
        connected.
      operationId: registryCredentialFromGit
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200":
          description: >-
            Stored. verified_at is empty when the connection's token cannot pull
            packages, which the screen shows as never signed in.

  /registries/{id}:
    delete:
      summary: Delete a registry credential (admin)
      operationId: deleteRegistryCredential
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Deleted }

  /git/connections:
    get:
      summary: List git connections (admin)
      operationId: listGitConnections
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Array of connections (tokens never returned) }
    post:
      summary: Add a git connection (admin; token stored encrypted)
      operationId: createGitConnection
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "201": { description: Created }

  /git/connections/{id}:
    delete:
      summary: Delete a git connection (admin)
      operationId: deleteGitConnection
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "204": { description: Deleted }

  /git/connections/{id}/repos:
    get:
      summary: List repositories the connection's token can access (admin)
      operationId: listGitConnectionRepos
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: "Array of {full_name, clone_url, default_branch, private}" }
        "502": { description: Provider API unreachable or rejected the token }

  /git/connections/github/setup:
    get:
      summary: GitHub App installation landing, turns the installation into a git connection (admin)
      operationId: githubAppSetup
      security: [{ session: [] }]
      responses:
        "302": { description: Redirect to Settings → Git }

  /git/connections/github/connect:
    get:
      summary: Begin one-click GitHub connect using the instance's OAuth app with repo scope (admin)
      operationId: gitConnectStart
      security: [{ session: [] }]
      responses:
        "302": { description: Redirect to GitHub authorize }
        "400":
          description: GitHub OAuth app not configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /templates:
    get:
      summary: List one-click database templates
      operationId: listTemplates
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Array of templates }

  /templates/{key}:
    post:
      summary: Create + deploy a database project from a template (member)
      operationId: createFromTemplate
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "201": { description: "{project, deployment}; credentials in project env" }

  /plugins:
    get:
      summary: List discovered plugins
      operationId: listPlugins
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
        "200": { description: Array of plugins with enabled/running state }

  /plugins/{name}/enable:
    post:
      summary: Enable and start a plugin (admin)
      operationId: enablePlugin
      security: [{ session: [] }, { bearerAuth: [] }]
      responses:
